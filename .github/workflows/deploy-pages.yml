name: Test and deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build production Web app
        run: flutter build web --release --base-href / --pwa-strategy none

      - name: Compile model Web Worker
        run: dart compile js -O4 --no-source-maps -o build/web/model_worker.js tool/model_worker.dart

      - name: Generate versioned offline cache
        run: dart run tool/generate_web_service_worker.dart

      - name: Verify deployment artifact
        run: |
          test -f build/web/main.dart.js
          test -f build/web/sqlite3.wasm
          test -f build/web/sqflite_sw.js
          test -f build/web/service_worker.js
          test -f build/web/model_worker.js
          test ! -e build/web/flutter_service_worker.js
          test "$(cat build/web/CNAME)" = "roulette.tedware.nl"
          grep -Fq '<base href="/">' build/web/index.html
          grep -Fq "canvasKitBaseUrl: 'canvaskit/'" build/web/flutter_bootstrap.js
          grep -Fq "fontFallbackBaseUrl: 'fallback_fonts/'" build/web/flutter_bootstrap.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
